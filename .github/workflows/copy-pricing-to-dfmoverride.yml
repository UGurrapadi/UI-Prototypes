name: Copy pricing files to DFMOverride

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy-pricing-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DFMOverride branch
        uses: actions/checkout@v4
        with:
          ref: DFMOverride
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if pricing files already exist
        id: check
        run: |
          if [ -f pricing.html ] && [ -f pricing.css ] && [ -f pricing.js ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Pricing files already exist on DFMOverride, skipping."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Pricing files not found on DFMOverride, will add them."
          fi

      - name: Restore pricing files from git history
        if: steps.check.outputs.exists == 'false'
        run: |
          # The pricing files exist in commit b06d1f2 (last commit on main before removal)
          git fetch origin
          git checkout b06d1f2 -- pricing.html pricing.css pricing.js
          echo "Pricing files restored from commit b06d1f2"

      - name: Commit and push pricing files
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pricing.html pricing.css pricing.js
          git commit -m "Add pricing files (moved from main to DFMOverride)

          pricing.html, pricing.css, and pricing.js are now maintained
          exclusively on this branch (DFMOverride) and have been removed
          from the default branch (main)."
          git push origin DFMOverride
          echo "Successfully pushed pricing files to DFMOverride."
